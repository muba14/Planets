<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Planets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-width app column, sticky header + search, scrolling feed, fixed 3-tab bar; art first, facts under it */
:root{
  color-scheme:dark;
  --bg:#000; --surface:#0a0c13; --surface2:#11141f; --line:#1d2233;
  --fg:#f4f6fb; --muted:#8c94a8; --dim:#5b6276;
  --blue:#3d7bff; --blue-soft:#7fb0ff; --purple:#8b5cf6; --purple-soft:#c4b5fd;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px;border-radius:6px}
sup{font-size:.68em;line-height:0}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line)}
.brand h1{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;margin:0;flex:1}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 9px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.chip.live{color:var(--blue-soft)} .chip.live i{background:var(--blue)}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:17px;height:17px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;padding:10px 0}
.search input::placeholder{color:var(--dim)}
.search:focus-within{border-color:var(--blue)}
.search button{color:var(--muted);font-size:13px;padding:6px 2px}

h2{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);margin:26px 0 12px;text-wrap:balance}
h2 small{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px;font-weight:500;margin-left:8px}
.note{color:var(--muted);font-size:12.5px;margin:8px 0 0}

/* feed */
.post{padding:16px 0 18px;border-bottom:1px solid var(--line)}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;padding:2px;background:linear-gradient(135deg,var(--blue),var(--purple))}
.post-head b{display:block;font-weight:700;line-height:1.2}
.post-head span{display:block;font-size:12px;color:var(--muted)}
.shot{display:block;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface);position:relative}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.acts{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.acts button{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:13px;font-weight:600}
.acts svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.acts .on.like svg{fill:var(--purple);stroke:var(--purple)}
.acts .on.save svg{fill:var(--blue);stroke:var(--blue)}
.acts .sp{flex:1}
.cap{margin:0;color:#d6dae6}
.cap b{color:var(--fg)}
.more{color:var(--blue-soft);font-weight:600;margin-top:4px;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stats span{font-size:12px;color:var(--purple-soft);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* apod */
.apod{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.apod img{width:100%;display:block;max-height:260px;object-fit:cover}
.apod div{padding:10px 12px}
.apod small{color:var(--blue-soft);font-weight:700;letter-spacing:.06em;font-size:11px;text-transform:uppercase}
.apod b{display:block}

/* explore */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block;width:100%}
.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.tile div{padding:9px 11px 11px}
.tile b{display:block;line-height:1.25}
.tile span{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.panel svg{display:block;width:100%;height:auto}
.panel svg text{font-family:var(--body)}

/* detail */
.back{display:flex;align-items:center;gap:6px;color:var(--blue-soft);font-weight:600;padding:14px 0 12px}
.back svg{width:18px;height:18px}
.d-title{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:16px 0 2px;text-wrap:balance}
.d-sub{color:var(--purple-soft);font-size:13px;font-weight:600;letter-spacing:.03em}
.d-p{color:#d6dae6;margin:12px 0 0;max-width:65ch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:44%;padding-right:10px}
td:last-child{font-weight:600;text-align:right}
tr:last-child td{border-bottom:0}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:112px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.bar span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
.bar i{display:block;height:8px;border-radius:4px;background:#2a3147}
.bar.me span{color:var(--fg);font-weight:700}
.bar.me i{background:linear-gradient(90deg,var(--blue),var(--purple))}
.src{font-size:12px;color:var(--dim);margin-top:18px}

/* timeline */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--fg);color:#000;border-color:var(--fg)}
.tl{position:relative;margin-top:8px;padding-left:26px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:0;width:2px;background:linear-gradient(var(--blue),var(--purple) 60%,var(--line))}
.decade{font-family:var(--display);font-size:22px;font-weight:700;color:var(--dim);margin:22px 0 6px;letter-spacing:.02em}
.ev{position:relative;padding:10px 0 14px}
.ev::before{content:"";position:absolute;left:-26px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--c)}
.ev time{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--c);text-transform:uppercase}
.ev h3{margin:2px 0 4px;font-size:16px;font-weight:700;line-height:1.3}
.ev p{margin:0;color:#c9cedc;font-size:14px}
.ev .tag{display:inline-block;margin-top:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.ev figure{margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.ev figure svg{display:block;width:100%;height:auto}
.ev figcaption{font-size:12px;color:var(--muted);margin-top:6px}

/* tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(4,5,9,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--dim)}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--fg)}
.tabs button.on svg{stroke:var(--blue-soft)}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">

          <radialGradient id="ng" cx="36%" cy="32%" r="75%"><stop offset="0" stop-color="#8fc0ff"/><stop offset=".45" stop-color="#3d6ff0"/><stop offset="1" stop-color="#0b1a5c"/></radialGradient>

      <input id="q" type="search" placeholder="Ara: Samanyolu, Neptün, Sirius…" autocomplete="off" aria-label="Gezegen, yıldız veya galaksi ara">

  <main>
    <section id="v-home">
      <div class="apod" id="apod" hidden></div>
      <div id="feed"></div>

    <section id="v-explore" hidden>

      <div class="panel" id="orbit"></div>
      <h2>Gezegenler</h2><div class="grid" id="g-planet"></div>
      <h2>Yıldızlar</h2><div class="grid" id="g-star"></div>
      <h2>Galaksiler</h2><div class="grid" id="g-galaxy"></div>
    </section>

    <section id="v-timeline" hidden>
      <h2>Ne kadar uzağa gittik? <small>logaritmik ölçek</small></h2>
      <div class="panel"><div class="bars" id="ladder"></div>
        <p class="note">Her basamak bir öncekinden yüzlerce kat uzak. Voyager 1 değeri 2026 için yaklaşıktır.</p></div>
      <h2>Uzay Çalışmaları <small>1957'den bugüne</small></h2>
      <div class="filters" id="filters"></div>
      <div class="tl" id="tl"></div>
    </section>

    <section id="v-detail" hidden></section>
  </main>
</div>

<nav class="tabs" id="tabs" aria-label="Sekmeler">

</nav>

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(o,S){
  S=S||600;const c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d"),R=rng(o.a.seed*977),a=o.a;
  x.fillStyle="#000";x.fillRect(0,0,S,S);
  [["61,123,255",.13],["139,92,246",.11]].forEach(([col,al])=>{const gx=R()*S,gy=R()*S,g=x.createRadialGradient(gx,gy,0,gx,gy,S*.6);g.addColorStop(0,`rgba(${col},${al})`);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,S,S)});
  for(let i=0;i<240;i++){x.fillStyle=`rgba(${R()<.2?"196,181,253":"255,255,255"},${.15+R()*.7})`;const r=R()*1.3+.3;x.beginPath();x.arc(R()*S,R()*S,r*S/600,0,7);x.fill()}
  const cx=S/2,cy=S/2;
  if(o.k==="planet"){
    const r=S*(a.ring?.2:.31);
    let g=x.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.5);g.addColorStop(0,`rgba(${a.glow},.38)`);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,S,S);
    x.save();x.translate(cx,cy);x.rotate(a.tilt||0);
    const ring=()=>{(a.ring||[]).forEach(([k,col,al,w])=>{x.beginPath();x.ellipse(0,0,r*k,r*k*.3,0,0,7);x.strokeStyle=`rgba(${col},${al})`;x.lineWidth=w*S/600;x.stroke()})};
    ring();
    x.save();x.beginPath();x.arc(0,0,r,0,7);x.clip();
    g=x.createLinearGradient(0,-r,0,r);a.cols.forEach((col,i)=>g.addColorStop(i/(a.cols.length-1||1),`rgb(${col})`));x.fillStyle=g;x.fillRect(-r,-r,2*r,2*r);
    for(let i=0;i<(a.stripes||0);i++){x.fillStyle=`rgba(${a.cols[Math.floor(R()*a.cols.length)]},.4)`;x.fillRect(-r,-r+R()*2*r,2*r,r*(.015+R()*.06))}
    (a.blobs||[]).forEach(([col,n,al])=>{for(let i=0;i<n;i++){const bx=(R()*2-1)*r,by=(R()*2-1)*r,br=r*(.06+R()*.3);const b=x.createRadialGradient(bx,by,0,bx,by,br);b.addColorStop(0,`rgba(${col},${al*6})`);b.addColorStop(1,`rgba(${col},0)`);x.fillStyle=b;x.fillRect(bx-br,by-br,2*br,2*br)}});
    if(a.cap){x.fillStyle="rgba(255,255,255,.8)";x.beginPath();x.ellipse(0,-r,r*.5,r*.13,0,0,7);x.fill();x.beginPath();x.ellipse(0,r,r*.42,r*.1,0,0,7);x.fill()}
    if(a.spot){const[sx,sy,rx,ry,col]=a.spot;x.fillStyle=`rgba(${col},.85)`;x.beginPath();x.ellipse(sx*r,sy*r,rx*r,ry*r,0,0,7);x.fill()}
    if(a.streak){x.strokeStyle="rgba(255,255,255,.55)";x.lineWidth=r*.022;x.lineCap="round";[[-.5,-.28,.3],[.1,.36,.26],[-.1,.02,.16]].forEach(([sx,sy,l])=>{x.beginPath();x.moveTo(sx*r,sy*r);x.quadraticCurveTo((sx+l/2)*r,(sy-.03)*r,(sx+l)*r,sy*r);x.stroke()})}
    x.rotate(-(a.tilt||0));
    g=x.createRadialGradient(-r*.45,-r*.45,0,-r*.45,-r*.45,r*1.95);g.addColorStop(0,"rgba(255,255,255,.14)");g.addColorStop(.42,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.93)");x.fillStyle=g;x.fillRect(-r,-r,2*r,2*r);
    x.restore();
    if(a.ring){x.save();x.beginPath();x.rect(-S,0,2*S,S);x.clip();ring();x.restore()}
    x.restore();
  }else if(o.k==="star"){
    const r=S*a.sr;
    let g=x.createRadialGradient(cx,cy,0,cx,cy,S*.5);g.addColorStop(0,`rgba(${a.col},.75)`);g.addColorStop(Math.min(.9,r/(S*.5)+.12),`rgba(${a.col},.22)`);g.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=g;x.fillRect(0,0,S,S);
    if(a.spikes){x.save();x.translate(cx,cy);x.globalCompositeOperation="lighter";for(let i=0;i<4;i++){x.rotate(Math.PI/2);const L=S*.44,sg=x.createLinearGradient(0,0,L,0);sg.addColorStop(0,`rgba(${a.core},.9)`);sg.addColorStop(1,`rgba(${a.col},0)`);x.fillStyle=sg;x.beginPath();x.moveTo(0,-r*.16);x.lineTo(L,0);x.lineTo(0,r*.16);x.fill()}x.restore()}
    g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,"#fff");g.addColorStop(.55,`rgb(${a.core})`);g.addColorStop(1,`rgb(${a.col})`);x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();
    if(a.grain){x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();for(let i=0;i<260;i++){const bx=cx+(R()*2-1)*r,by=cy+(R()*2-1)*r,br=r*(.03+R()*.1);x.fillStyle=R()<.5?`rgba(${a.core},.16)`:"rgba(120,30,0,.13)";x.beginPath();x.arc(bx,by,br,0,7);x.fill()}
      g=x.createRadialGradient(cx,cy,r*.5,cx,cy,r);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(120,20,0,.4)");x.fillStyle=g;x.fillRect(cx-r,cy-r,2*r,2*r);x.restore()}
  }else{
    const gs=()=>(R()+R()+R()-1.5)/1.5, u=S/600;
    x.save();x.translate(cx,cy);x.rotate(a.rot||0);x.scale(1,a.squash||1);x.globalCompositeOperation="lighter";
    const dot=(px,py,col,al,sz)=>{x.fillStyle=`rgba(${col},${al})`;x.fillRect(px,py,sz*u,sz*u)};
    const glow=(rad,col,al)=>{const g=x.createRadialGradient(0,0,0,0,0,rad);g.addColorStop(0,`rgba(${col},${al})`);g.addColorStop(1,`rgba(${col},0)`);x.fillStyle=g;x.beginPath();x.arc(0,0,rad,0,7);x.fill()};
    if(a.type==="spiral"){
      glow(S*.42,"90,110,220",.16);
      for(let i=0;i<9000;i++){const arm=Math.floor(R()*a.arms),t=Math.pow(R(),.75),rr=t*S*.4,sp=(a.loose?.5:.3)*(0.4+t);
        const ang=arm*2*Math.PI/a.arms+t*a.wind+gs()*sp,px=Math.cos(ang)*rr+gs()*6*u,py=Math.sin(ang)*rr+gs()*6*u;
        const col=t<.25?"255,226,186":R()<.3?"196,160,255":R()<.12?"255,150,190":"140,176,255";dot(px,py,col,.2+R()*.5,.7+R()*1.5)}
      if(a.bar){x.save();x.scale(2.3,.75);glow(S*.07,"255,226,180",.8);x.restore()}
      glow(S*.1,"255,236,200",.95);glow(S*.03,"255,255,255",1);
    }else if(a.type==="elliptical"){
      glow(S*.42,"255,214,160",.28);glow(S*.2,"255,226,186",.6);
      for(let i=0;i<4500;i++){const rr=Math.abs(gs())*S*.36,an=R()*7;dot(Math.cos(an)*rr,Math.sin(an)*rr,"255,224,186",.15+R()*.4,.7+R()*1.2)}
      glow(S*.05,"255,255,255",1);
      if(a.jet){x.save();x.rotate(-.5);const g=x.createLinearGradient(0,0,S*.3,0);g.addColorStop(0,"rgba(150,190,255,.95)");g.addColorStop(1,"rgba(150,190,255,0)");x.fillStyle=g;x.fillRect(0,-2.5*u,S*.3,5*u);x.restore()}
    }else if(a.type==="irregular"){
      glow(S*.34,"110,130,230",.18);
      x.save();x.scale(2.6,.6);glow(S*.07,"255,224,190",.7);x.restore();
      for(let k=0;k<9;k++){const kx=gs()*S*.22,ky=gs()*S*.2,kr=S*(.05+R()*.1),col=R()<.35?"255,150,190":R()<.5?"196,160,255":"150,184,255";
        for(let i=0;i<700;i++)dot(kx+gs()*kr,ky+gs()*kr,col,.15+R()*.45,.7+R()*1.4)}
      for(let i=0;i<2500;i++)dot(gs()*S*.28,gs()*S*.24,"230,224,255",.1+R()*.3,.7+R())
    }else{ /* sombrero */
      x.save();x.scale(1,2.6);glow(S*.22,"255,230,190",.6);x.restore();
      for(let i=0;i<7000;i++){const rr=(.25+Math.abs(gs())*.75)*S*.4,an=R()*7;dot(Math.cos(an)*rr,Math.sin(an)*rr,R()<.3?"170,190,255":"255,226,190",.12+R()*.4,.7+R()*1.3)}
      x.save();x.scale(1,2.4);glow(S*.08,"255,255,240",1);x.restore();
      x.globalCompositeOperation="source-over";x.beginPath();x.ellipse(0,0,S*.36,S*.36,0,.05,Math.PI-.05);x.strokeStyle="rgba(8,5,2,.88)";x.lineWidth=S*.075;x.stroke();
    }
    x.restore();
  }
  return c.toDataURL("image/jpeg",.86);
}
O.forEach(o=>{o.img=art(o)});

/* ---------- durum ---------- */
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const liked=new Set(store.get("pl-like",[])), saved=new Set(store.get("pl-save",[]));
let tab=store.get("pl-tab","home"), lastScroll=0, filter="all";

/* ---------- ana sayfa ---------- */
const ICON={like:'<svg viewBox="0 0 24 24"><path d="M12 20.500s-7.500-4.600-7.500-10A4.300 4.300 0 0 1 12 8a4.300 4.300 0 0 1 7.500 2.500c0 5.400-7.500 10-7.500 10z"/></svg>',save:'<svg viewBox="0 0 24 24"><path d="M6 4h12v16.500l-6-4.500-6 4.500z"/></svg>'};
function postHTML(o){
  const s=o.rows.slice(0,3).map(r=>`<span>${esc(r[0])}: ${fmt(r[1].replace(/\s*\(.*\)/,""))}</span>`).join("");
  return `<article class="post">
    <div class="post-head"><img class="ava" src="${o.img}" data-art="${o.id}" alt=""><div><b>${esc(o.n)}</b><span>${KIND[o.k]} · ${esc(o.sub)}</span></div></div>
    <button class="shot" data-open="${o.id}" aria-label="${esc(o.n)} ayrıntıları"><img src="${o.img}" data-art="${o.id}" alt="${esc(o.n)}"></button>
    <div class="acts"><button class="like ${liked.has(o.id)?"on":""}" data-like="${o.id}" aria-pressed="${liked.has(o.id)}">${ICON.like}<span>${liked.has(o.id)?"Beğenildi":"Beğen"}</span></button><span class="sp"></span><button class="save ${saved.has(o.id)?"on":""}" data-save="${o.id}" aria-pressed="${saved.has(o.id)}" aria-label="Kaydet">${ICON.save}</button></div>
    <p class="cap"><b>${esc(o.n)}</b> ${esc(o.hook)} ${esc(o.p.split(". ")[0])}.</p>
    <div class="stats">${s}</div>
    <button class="more" data-open="${o.id}">Tüm bilgileri gör</button>
  </article>`;
}
function renderFeed(){
  const q=norm($("#q").value.trim());$("#qx").hidden=!q;
  let list;
  if(q){list=O.filter(o=>norm(o.n+" "+o.kw+" "+o.sub+" "+KIND[o.k]).includes(q))}
  else list=FEED.map(id=>BY[id]);
  $("#feed").innerHTML=list.length?list.map(postHTML).join(""):`<p class="empty">“${esc($("#q").value)}” için sonuç yok.<br>Örneğin “Samanyolu”, “galaksi” veya “Mars” yazmayı dene.</p>`;
  $("#apod").hidden=!!q||!$("#apod").innerHTML;
}

/* ---------- keşfet ---------- */
function renderExplore(){
  ["planet","star","galaxy"].forEach(k=>{$("#g-"+k).innerHTML=O.filter(o=>o.k===k).map(o=>`<button class="tile" data-open="${o.id}"><img src="${o.img}" data-art="${o.id}" alt=""><div><b>${esc(o.n)}</b><span>${esc(o.sub)}</span></div></button>`).join("")});
  const P=O.filter(o=>o.k==="planet"),X=au=>32+(Math.log10(au)-Math.log10(.3))/(Math.log10(35)-Math.log10(.3))*292;
  const colr={merkur:"#9a9794",venus:"#e0b878",dunya:"#3d7bff",mars:"#c8623c",jupiter:"#d2b08a",saturn:"#e0c88c",uranus:"#a4e0e6",neptun:"#4a78f0"};
  let s=`<svg viewBox="0 0 340 118" role="img" aria-label="Gezegenlerin Güneş'e uzaklığı"><line x1="14" y1="58" x2="332" y2="58" stroke="#1d2233" stroke-width="1"/><circle cx="12" cy="58" r="9" fill="#ffb03c"/><circle cx="12" cy="58" r="14" fill="#ffb03c" opacity=".18"/>`;
  [1,10].forEach(t=>{s+=`<line x1="${X(t)}" y1="96" x2="${X(t)}" y2="102" stroke="#5b6276"/><text x="${X(t)}" y="113" fill="#5b6276" font-size="8.500" text-anchor="middle">${t} AU</text>`});
  P.forEach((o,i)=>{const r=2.5+Math.sqrt(o.v/139820)*8.5,up=i%2===0,x=X(o.au);
    s+=`<g data-open="${o.id}" style="cursor:pointer"><circle cx="${x}" cy="58" r="${Math.max(r,9)}" fill="#000" opacity="0"/><circle cx="${x}" cy="58" r="${r}" fill="${colr[o.id]}"/><text x="${x}" y="${up?58-r-6:58+r+13}" fill="#f4f6fb" font-size="9" font-weight="600" text-anchor="middle">${o.n}</text></g>`});
  $("#orbit").innerHTML=s+`</svg><p class="note">Noktaların boyutu gezegen çaplarıyla orantılıdır (karekök ölçeği). 1 AU = Dünya–Güneş uzaklığı, 149,6 milyon km.</p>`;
}

/* ---------- çubuk grafik ---------- */
function bars(items,me){
  const vs=items.map(i=>i[1]),lo=Math.log10(Math.min(...vs)/3),hi=Math.log10(Math.max(...vs));
  return items.map(([n,v,lab,id])=>`<div class="bar ${id===me?"me":""}"><span>${esc(n)}</span><i style="width:${Math.max(3,(Math.log10(v)-lo)/(hi-lo)*100).toFixed(1)}%"></i><span>${fmt(lab)}</span></div>`).join("");
}
const num=n=>n.toLocaleString("tr-TR");

/* ---------- ayrıntı ---------- */
function openDetail(id){
  const o=BY[id];if(!o)return;lastScroll=window.scrollY;
  const group=O.filter(g=>g.k===o.k).slice().sort((a,b)=>b.v-a.v);
  const unit=o.k==="planet"?[" km","Çap karşılaştırması"]:o.k==="star"?[" R☉","Yarıçap karşılaştırması (Güneş = 1)"]:[" ıy","Çap karşılaştırması (ışık yılı)"];
  $("#v-detail").innerHTML=`<button class="back" id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>Geri</button>
    <div class="shot"><img src="${o.img}" data-art="${o.id}" alt="${esc(o.n)}"></div>
    <h2 class="d-title" style="text-transform:none;letter-spacing:0">${esc(o.n)}</h2><div class="d-sub">${KIND[o.k]} · ${esc(o.sub)}</div>
    <p class="d-p">${esc(o.p)}</p>
    <h2>Temel bilgiler</h2>
    <div class="panel"><table>${o.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${fmt(esc(r[1]))}</td></tr>`).join("")}</table></div>
    <h2>${unit[1]} <small>logaritmik ölçek</small></h2>
    <div class="panel"><div class="bars">${bars(group.map(g=>[g.n,g.v,num(g.v)+unit[0],g.id]),o.id)}</div></div>
    <p class="src" id="credit">Değerler NASA gezegen bilgi sayfaları ve astronomi kataloglarındaki yaklaşık değerlerdir; yıldız ve galaksi ölçümleri tahminidir.</p>`;
  show("detail");window.scrollTo(0,0);applyLive();
  if(INAPP){try{history.pushState({d:1},"")}catch(e){}}
}

/* ---------- kronoloji ---------- */
function moonFig(){
  const d=9.6,x0=12;let s=`<svg viewBox="0 0 320 44" role="img" aria-label="Dünya ile Ay arası ölçekli uzaklık">`;
  for(let i=1;i<30;i++)s+=`<circle cx="${x0+d/2+i*d}" cy="20" r="${d/2-.8}" fill="none" stroke="#1d2233"/>`;
  s+=`<circle cx="${x0+d/2}" cy="20" r="${d/2}" fill="#3d7bff"/><circle cx="${x0+d/2+30.2*d}" cy="20" r="${d*.136}" fill="#f4f6fb"/>
  <text x="${x0}" y="40" fill="#8c94a8" font-size="9">Dünya</text><text x="${x0+30.2*d+8}" y="40" fill="#8c94a8" font-size="9" text-anchor="end">Ay</text></svg>`;
  return `<figure>${s}<figcaption>Gerçek ölçek: Dünya ile Ay arasına yaklaşık 30 Dünya sığar (384.400 km). Apollo 11 bu yolu 3 günde aştı.</figcaption></figure>`;
}
function renderTimeline(){
  $("#ladder").innerHTML=bars([["UUİ yörüngesi",400,"400 km"],["Ay",384400,"384.400 km"],["Mars",2.25e8,"≈225 mn km"],["Plüton",4.8e9,"≈4,8 mr km"],["Voyager 1",2.5e10,"≈25 mr km"]],null).replace(/class="bar "/g,'class="bar me"');
  $("#filters").innerHTML=[["all","Tümü"],...Object.entries(CAT).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button data-f="${k}" class="${filter===k?"on":""}">${l}</button>`).join("");
  let dec=0,h="";
  EV.filter(e=>filter==="all"||e[4]===filter).forEach(e=>{const d=Math.floor(e[0]/10)*10;if(d!==dec){dec=d;h+=`<div class="decade">${d}'ler</div>`}
    h+=`<article class="ev" style="--c:${CAT[e[4]][1]}"><time>${e[1]}</time><h3>${esc(e[2])}</h3><p>${esc(e[3])}</p><span class="tag">${CAT[e[4]][0]}</span>${e[5]==="moon"?moonFig():""}</article>`});
  $("#tl").innerHTML=h;
}

/* ---------- gezinme ---------- */
const INAPP=location.protocol==="file:";
function closeDetail(){if(!$("#v-detail").hidden){show(tab);window.scrollTo(0,lastScroll)}}
window.addEventListener("popstate",closeDetail);
function show(v){
  ["home","explore","timeline","detail"].forEach(n=>{$("#v-"+n).hidden=n!==v});
  $("#searchBox").hidden=v!=="home";
  if(v!=="detail"){tab=v;store.set("pl-tab",v)}
  document.querySelectorAll("#tabs button").forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false")});
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-open],[data-like],[data-save],[data-tab],[data-f],#back,#qx");if(!t)return;
  if(t.id==="back"){if(INAPP&&history.state&&history.state.d){history.back();return}closeDetail();return}
  if(t.id==="qx"){$("#q").value="";renderFeed();applyLive();$("#q").focus();return}
  if(t.dataset.open)return openDetail(t.dataset.open);
  if(t.dataset.tab){show(t.dataset.tab);window.scrollTo(0,0);return}
  if(t.dataset.f){filter=t.dataset.f;renderTimeline();return}
  const isLike=!!t.dataset.like,set=isLike?liked:saved,id=t.dataset.like||t.dataset.save;
  set.has(id)?set.delete(id):set.add(id);store.set(isLike?"pl-like":"pl-save",[...set]);
  t.classList.toggle("on",set.has(id));t.setAttribute("aria-pressed",set.has(id));
  if(isLike)t.querySelector("span").textContent=set.has(id)?"Beğenildi":"Beğen";
});
$("#q").addEventListener("input",()=>{renderFeed();applyLive()});

/* ---------- canlı veri: Wikipedia görselleri + NASA günün görseli ---------- */
const live={};
function applyLive(){document.querySelectorAll("img[data-art]").forEach(im=>{const u=live[im.dataset.art];if(u&&im.dataset.done!==u&&!im.classList.contains("ava")){im.dataset.done=u;const t=new Image();t.onload=()=>{im.src=u};t.src=u}})}
async function wiki(o){
  const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+o.wiki);if(!r.ok)throw 0;
  const j=await r.json(),u=j.thumbnail&&j.thumbnail.source;if(u){live[o.id]=u.replace(/\/\d+px-/,"/640px-");applyLive()}
}
async function goLive(){
  try{await wiki(BY.neptun)}catch(e){return}
  const st=$("#status");st.classList.add("live");st.querySelector("span").textContent="canlı görseller";
  O.filter(o=>o.id!=="neptun").forEach(o=>wiki(o).catch(()=>{}));
  try{
    const r=await fetch("https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY");if(!r.ok)return;const j=await r.json();
    if(j.media_type==="image"&&j.url){$("#apod").innerHTML=`<img src="${esc(j.url)}" alt=""><div><small>NASA · Günün Uzay Görseli</small><b>${esc(j.title||"")}</b></div>`;renderFeed();applyLive()}
  }catch(e){}
}

renderFeed();renderExplore();renderTimeline();show(tab==="detail"?"home":tab);goLive();
</script>
